spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "http://skybooker.site"
              - "http://www.skybooker.site"
              - "https://skybooker.site"
              - "https://www.skybooker.site"
              - "http://3.219.251.65"
              - "https://3.219.251.65"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            exposedHeaders:
              - "Authorization"
              - "Content-Type"
            allowCredentials: true
            maxAge: 3600
      routes:
        # ===== Swagger API Docs routes (MUST come before general routes) =====
        - id: flight-service-api-docs
          uri: lb://flight-service
          predicates:
            - Path=/flights/v3/api-docs
          filters:
            - SetRequestHostHeader=localhost:8080
            - RewritePath=/flights/v3/api-docs, /v3/api-docs

        - id: seat-service-api-docs
          uri: lb://seat-service
          predicates:
            - Path=/seats/v3/api-docs
          filters:
            - SetRequestHostHeader=localhost:8080
            - RewritePath=/seats/v3/api-docs, /v3/api-docs

        - id: booking-service-api-docs
          uri: lb://booking-service
          predicates:
            - Path=/bookings/v3/api-docs
          filters:
            - SetRequestHostHeader=localhost:8080
            - RewritePath=/bookings/v3/api-docs, /v3/api-docs

        - id: passenger-service-api-docs
          uri: lb://passenger-service
          predicates:
            - Path=/passengers/v3/api-docs
          filters:
            - SetRequestHostHeader=localhost:8080
            - RewritePath=/passengers/v3/api-docs, /v3/api-docs

        - id: payment-service-api-docs
          uri: lb://payment-service
          predicates:
            - Path=/payments/v3/api-docs
          filters:
            - SetRequestHostHeader=localhost:8080
            - RewritePath=/payments/v3/api-docs, /v3/api-docs

        - id: notification-service-api-docs
          uri: lb://notification-service
          predicates:
            - Path=/notifications/v3/api-docs
          filters:
            - SetRequestHostHeader=localhost:8080
            - RewritePath=/notifications/v3/api-docs, /v3/api-docs

        - id: airline-airport-service-api-docs
          uri: lb://airline-airport-service
          predicates:
            - Path=/airlines/v3/api-docs
          filters:
            - SetRequestHostHeader=localhost:8080
            - RewritePath=/airlines/v3/api-docs, /v3/api-docs

        - id: auth-service-api-docs
          uri: lb://auth-service
          predicates:
            - Path=/auth/v3/api-docs
          filters:
            - SetRequestHostHeader=localhost:8080

        - id: admin-user-service-api-docs
          uri: lb://admin-user-service
          predicates:
            - Path=/admin/v3/api-docs
          filters:
            - SetRequestHostHeader=localhost:8080

        - id: admin-service-api-docs
          uri: lb://admin-service
          predicates:
            - Path=/admin-server/v3/api-docs
          filters:
            - SetRequestHostHeader=localhost:8080
            - RewritePath=/admin-server/v3/api-docs, /v3/api-docs

        # ===== General service routes =====
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth,/auth/**

        - id: flight-service
          uri: lb://flight-service
          predicates:
            - Path=/flights,/flights/**

        - id: seat-service
          uri: lb://seat-service
          predicates:
            - Path=/seats,/seats/**

        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/bookings,/bookings/**

        - id: ticket-service
          uri: lb://booking-service
          predicates:
            - Path=/tickets,/tickets/**

        - id: passenger-service
          uri: lb://passenger-service
          predicates:
            - Path=/passengers,/passengers/**

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments,/payments/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notifications,/notifications/**

        - id: airline-service
          uri: lb://airline-airport-service
          predicates:
            - Path=/airlines,/airlines/**

        - id: airport-service
          uri: lb://airline-airport-service
          predicates:
            - Path=/airports,/airports/**

        - id: admin-user-service
          uri: lb://admin-user-service
          predicates:
            - Path=/admin,/admin/**
          filters:
            - JwtAuthenticationFilter

        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/admin-server,/admin-server/**
          filters:
            - StripPrefix=1
            - JwtAuthenticationFilter


server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true

jwt:
  secret: skyBookerSecretKeyForJWTTokenValidationPurpose123456789
  expiration: 86400000

logging:
  level:
    ROOT: INFO
    com.skyBooker: INFO

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /auth/v3/api-docs
      - name: flight-service
        url: /flights/v3/api-docs
      - name: seat-service
        url: /seats/v3/api-docs
      - name: booking-service
        url: /bookings/v3/api-docs
      - name: passenger-service
        url: /passengers/v3/api-docs
      - name: payment-service
        url: /payments/v3/api-docs
      - name: notification-service
        url: /notifications/v3/api-docs
      - name: airline-airport-service
        url: /airlines/v3/api-docs
      - name: admin-user-service
        url: /admin/v3/api-docs
      - name: admin-service
        url: /admin-server/v3/api-docs
    oauth:
      use-pkce-with-authorization-code-grant: true
