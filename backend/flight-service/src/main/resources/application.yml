spring:
  application:
    name: flight-service
  datasource:
    url: jdbc:postgresql://postgres:5432/flight_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    preferIpAddress: true

server:
  port: 8082

logging:
  level:
    ROOT: INFO
    com.skyBooker: INFO

services:
  seat:
    base-url: ${SEAT_SERVICE_URL:http://seat-service:8083}
  booking:
    base-url: ${BOOKING_SERVICE_URL:http://booking-service:8084}
  passenger:
    base-url: ${PASSENGER_SERVICE_URL:http://passenger-service:8085}
  auth:
    base-url: ${AUTH_SERVICE_URL:http://auth-service:8081}
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8087}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
