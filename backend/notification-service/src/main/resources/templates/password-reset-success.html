<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Successful</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; background-color: #f4f7f6; }
        .container { max-width: 600px; margin: 20px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 2px solid #00236f; padding-bottom: 20px; margin-bottom: 20px; }
        .header h1 { color: #22c55e; margin: 0; font-size: 24px; }
        .content { margin-bottom: 30px; }
        .footer { text-align: center; font-size: 12px; color: #777; border-top: 1px solid #ddd; padding-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Password Reset Successful</h1>
    </div>
    <div class="content">
        <p>Hello <span th:text="${firstName}">Traveler</span>,</p>
        <p>Your SkyBooker password has been successfully reset.</p>
        <p>You can now log in to your account using your new password.</p>
        <p>If you did not perform this action, please contact our support team immediately.</p>
    </div>
    <div class="footer">
        <p>&copy; 2024 SkyBooker Airlines. All rights reserved.</p>
    </div>
</div>
</body>
</html>
