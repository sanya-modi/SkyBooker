#       - api-gateway
#     networks:
#       - skyBooker-network

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres-sonar:5432/sonar_db
      - SONAR_JDBC_USERNAME=postgres
      - SONAR_JDBC_PASSWORD=postgres
    depends_on:
      postgres-sonar:
        condition: service_healthy
    networks:
      - skyBooker-network

  postgres-sonar:
    image: postgres:15-alpine
    container_name: postgres-sonar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: sonar_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5442:5432"
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - skyBooker-network

volumes:
  auth_db_data:
  flight_db_data:
  seat_db_data:
  booking_db_data:
  passenger_db_data:
  payment_db_data:
  notification_db_data:
  airline_airport_db_data:
  admin_db_data:
  sonar_db_data:

networks:
  skyBooker-network:
    driver: bridge

