spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5432/booking_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  cloud:
    loadbalancer:
      ribbon:
        enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    enabled: true
  instance:
    preferIpAddress: true

server:
  port: 8084

logging:
  level:
    ROOT: INFO
    com.skyBooker: INFO

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Service URLs for direct communication
services:
  flight-base-url: ${FLIGHT_SERVICE_URL:http://localhost:8082}
  seat-base-url: ${SEAT_SERVICE_URL:http://localhost:8083}
  payment-base-url: ${PAYMENT_SERVICE_URL:http://localhost:8086}
  notification-base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
  auth-base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  passenger-base-url: ${PASSENGER_SERVICE_URL:http://localhost:8085}
