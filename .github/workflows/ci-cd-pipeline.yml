name: SkyBooker CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

jobs:
  backend-test:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Unit Tests
        run: |
          cd backend
          mvn clean test -Dtest=*Test

      - name: Integration Tests
        run: |
          cd backend
          mvn verify -Dtest=*IT

      - name: Code Coverage
        run: |
          cd backend
          mvn jacoco:report

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd backend
          mvn sonar:sonar \
            -Dsonar.projectKey=skybooker-backend \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

      - name: Security Scan - OWASP Dependency Check
        run: |
          cd backend
          mvn org.owasp:dependency-check-maven:check

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/**/target/surefire-reports/

  frontend-test:
    name: Frontend Tests & Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Unit Tests
        run: |
          cd frontend
          npm run test:coverage

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd frontend
          npx sonarqube-scanner \
            -Dsonar.projectKey=skybooker-frontend \
            -Dsonar.sources=src \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      - name: Security Scan - npm audit
        run: |
          cd frontend
          npm audit --audit-level=moderate

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  e2e-tests:
    name: E2E & Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Start Backend Services
        run: |
          cd backend
          mvn clean install -DskipTests
          nohup java -jar eureka-server/target/*.jar &
          sleep 30
          nohup java -jar api-gateway/target/*.jar &
          nohup java -jar auth-service/target/*.jar &
          nohup java -jar flight-service/target/*.jar &
          sleep 30

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps

      - name: Run E2E Tests
        run: |
          cd frontend
          npm run build
          npx playwright test

      - name: Upload E2E Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: frontend/playwright-report/

  performance-test:
    name: Performance & Load Testing
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run Load Tests
        run: k6 run tests/load-test.js

      - name: Upload Performance Report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance-report.html

  security-scan:
    name: Security Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, e2e-tests, performance-test, security-scan]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - eureka-server
          - api-gateway
          - auth-service
          - flight-service
          - seat-service
          - booking-service
          - passenger-service
          - payment-service
          - notification-service
          - airline-airport-service
          - admin-service
          - admin-user-service
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image
        run: |
          cd backend
          docker build -f ${{ matrix.service }}/Dockerfile -t ${{ env.ECR_REGISTRY }}/skybooker-${{ matrix.service }}:${{ github.sha }} .
          docker tag ${{ env.ECR_REGISTRY }}/skybooker-${{ matrix.service }}:${{ github.sha }} ${{ env.ECR_REGISTRY }}/skybooker-${{ matrix.service }}:latest
          docker push ${{ env.ECR_REGISTRY }}/skybooker-${{ matrix.service }}:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/skybooker-${{ matrix.service }}:latest

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: [frontend-test, e2e-tests, security-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Frontend Image
        run: |
          cd frontend
          docker build -t ${{ env.ECR_REGISTRY }}/skybooker-frontend:${{ github.sha }} .
          docker tag ${{ env.ECR_REGISTRY }}/skybooker-frontend:${{ github.sha }} ${{ env.ECR_REGISTRY }}/skybooker-frontend:latest
          docker push ${{ env.ECR_REGISTRY }}/skybooker-frontend:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/skybooker-frontend:latest

  deploy-to-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [build-and-push, build-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          ssh -o StrictHostKeyChecking=no -i private_key.pem $EC2_USER@$EC2_HOST << 'EOF'
            # Login to ECR
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
            
            # Pull latest images
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-eureka-server:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-api-gateway:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-auth-service:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-flight-service:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-seat-service:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-booking-service:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-passenger-service:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-payment-service:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-notification-service:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-airline-airport-service:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-admin-service:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-admin-user-service:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-frontend:latest
            
            # Stop and remove old containers
            cd /home/$EC2_USER/skybooker
            docker-compose down
            
            # Start new containers
            docker-compose up -d
            
            # Clean up old images
            docker image prune -af
          EOF
          
          rm -f private_key.pem

  health-check:
    name: Post-Deployment Health Check
    runs-on: ubuntu-latest
    needs: [deploy-to-ec2]
    steps:
      - name: Wait for Services
        run: sleep 60

      - name: Health Check - Eureka
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:8761/actuator/health || exit 1

      - name: Health Check - API Gateway
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:8080/actuator/health || exit 1

      - name: Health Check - Auth Service
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:8081/actuator/health || exit 1

      - name: Health Check - Flight Service
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:8082/actuator/health || exit 1

      - name: Health Check - Frontend
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:3000 || exit 1

      - name: Smoke Tests
        run: |
          # Test flight search endpoint
          curl -f http://${{ secrets.EC2_HOST }}:8080/api/flights/search || exit 1

  regression-test:
    name: Regression Testing
    runs-on: ubuntu-latest
    needs: [health-check]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Regression Tests
        run: |
          cd frontend
          npm ci
          BASE_URL=http://${{ secrets.EC2_HOST }} npm run test:regression

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [regression-test]
    if: always()
    steps:
      - name: Send Notification
        run: |
          echo "Deployment completed with status: ${{ job.status }}"
