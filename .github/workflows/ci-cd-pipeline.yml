name: SkyBooker CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  backend-test:
    name: Backend JUnit & Mockito Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests
        run: |
          cd backend
          mvn clean test

      - name: Generate Coverage Report
        run: |
          cd backend
          mvn jacoco:report

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/**/target/surefire-reports/

  frontend-test:
    name: Frontend Vitest Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest Tests
        run: |
          cd frontend
          npm run test:coverage

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/



  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - eureka-server
          - api-gateway
          - auth-service
          - flight-service
          - seat-service
          - booking-service
          - passenger-service
          - payment-service
          - notification-service
          - airline-airport-service
          - admin-service
          - admin-user-service
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image
        run: |
          cd backend
          docker build -f ${{ matrix.service }}/Dockerfile -t ${{ env.ECR_REGISTRY }}/skybooker-${{ matrix.service }}:${{ github.sha }} .
          docker tag ${{ env.ECR_REGISTRY }}/skybooker-${{ matrix.service }}:${{ github.sha }} ${{ env.ECR_REGISTRY }}/skybooker-${{ matrix.service }}:latest
          docker push ${{ env.ECR_REGISTRY }}/skybooker-${{ matrix.service }}:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/skybooker-${{ matrix.service }}:latest

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: [frontend-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Frontend Image
        run: |
          cd frontend
          docker build -t ${{ env.ECR_REGISTRY }}/skybooker-frontend:${{ github.sha }} .
          docker tag ${{ env.ECR_REGISTRY }}/skybooker-frontend:${{ github.sha }} ${{ env.ECR_REGISTRY }}/skybooker-frontend:latest
          docker push ${{ env.ECR_REGISTRY }}/skybooker-frontend:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/skybooker-frontend:latest

  deploy-to-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [build-and-push, build-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          ssh -o StrictHostKeyChecking=no -i private_key.pem $EC2_USER@$EC2_HOST << 'EOF'
            # Login to ECR
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
            
            # Pull latest images
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-eureka-server:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-api-gateway:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-auth-service:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-flight-service:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-seat-service:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-booking-service:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-passenger-service:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-payment-service:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-notification-service:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-airline-airport-service:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-admin-service:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-admin-user-service:latest
            docker pull ${{ env.ECR_REGISTRY }}/skybooker-frontend:latest
            
            # Stop and remove old containers
            cd /home/$EC2_USER/skybooker
            docker-compose down
            
            # Start new containers
            docker-compose up -d
            
            # Clean up old images
            docker image prune -af
          EOF
          
          rm -f private_key.pem

  health-check:
    name: Post-Deployment Health Check
    runs-on: ubuntu-latest
    needs: [deploy-to-ec2]
    steps:
      - name: Wait for Services
        run: sleep 90

      - name: Health Check - Eureka
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:8761/actuator/health || exit 1

      - name: Health Check - API Gateway
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:8080/actuator/health || exit 1

      - name: Health Check - Auth Service
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:8081/actuator/health || exit 1

      - name: Health Check - Flight Service
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:8082/actuator/health || exit 1

      - name: Health Check - Frontend
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:3000 || exit 1
