name: SkyBooker CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE_TAG: v1

jobs:
  backend-test:
    name: Backend JUnit & Mockito Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests
        run: |
          cd backend
          mvn clean test

      - name: Generate Coverage Report
        run: |
          cd backend
          mvn jacoco:report

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          cd backend
          mvn sonar:sonar \
            -Dsonar.projectKey=skybooker \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/**/target/surefire-reports/

  frontend-test:
    name: Frontend Vitest Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest Tests
        run: |
          cd frontend
          npm run test:coverage -- --run --reporter=verbose --bail=1

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/



  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    environment: CI/CD
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - eureka-server
          - api-gateway
          - auth-service
          - flight-service
          - seat-service
          - booking-service
          - passenger-service
          - payment-service
          - notification-service
          - airline-airport-service
          - admin-service
          - admin-user-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend-${{ matrix.service }}:${{ env.DOCKER_IMAGE_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/backend-${{ matrix.service }}:latest

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    environment: CI/CD
    needs: [frontend-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.FRONTEND_VITE_API_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.FRONTEND_VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/skybooker-frontend:${{ env.DOCKER_IMAGE_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/skybooker-frontend:latest

  deploy-to-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    environment: CI/CD
    needs: [build-and-push, build-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          ssh -o StrictHostKeyChecking=no -i private_key.pem $EC2_USER@$EC2_HOST << 'EOF'
            cd /home/$EC2_USER/skybooker

            # Pull the exact image tags referenced by docker-compose.yml
            docker-compose pull

            # Recreate containers with the freshly pulled images
            docker-compose up -d --force-recreate --remove-orphans
            
            # Clean up old images
            docker image prune -af
          EOF
          
          rm -f private_key.pem

  health-check:
    name: Post-Deployment Health Check
    runs-on: ubuntu-latest
    environment: CI/CD
    needs: [deploy-to-ec2]
    steps:
      - name: Wait for Services
        run: sleep 90

      - name: Health Check - Eureka
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:8761/actuator/health || exit 1

      - name: Health Check - API Gateway
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:8080/actuator/health || exit 1

      - name: Health Check - Auth Service
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:8081/actuator/health || exit 1

      - name: Health Check - Flight Service
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:8082/actuator/health || exit 1

      - name: Health Check - Frontend
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:3000 || exit 1
